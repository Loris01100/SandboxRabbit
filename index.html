<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Sandbox Rabbit — bac à sable</title>
    <meta name="description" content="Un bac à sable cellulaire : sable, eau, feu, acide, lave. Déposez, mélangez, regardez." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐇</text></svg>" />
    <script type="module" src="/src/client/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <h1>Sandbox<span>Rabbit</span></h1>
      <div class="stats"><span id="fps">–</span> fps · <span id="filled">0</span> cellules</div>
    </header>

    <main>
      <div class="stage">
        <canvas id="world" aria-label="Bac à sable"></canvas>
      </div>

      <aside class="panel">
        <details class="group" open>
          <summary>Matière</summary>
          <div id="palette" class="palette"></div>
          <p id="hint" class="hint"></p>
        </details>

        <details class="group" open>
          <summary>Pinceau</summary>
          <label class="row">
            <span>Taille</span>
            <input id="brush" type="range" min="1" max="24" value="5" />
            <output id="brush-value">5</output>
          </label>
          <label class="check">
            <input id="keep" type="checkbox" />
            <span>Ne pas remplacer la matière déjà posée</span>
          </label>
        </details>

        <details class="group" open>
          <summary>Simulation</summary>
          <label class="row">
            <span>Vitesse</span>
            <input id="speed" type="range" min="1" max="16" value="4" />
            <output id="speed-value">×1</output>
          </label>
          <div class="buttons">
            <button id="play" type="button">Pause</button>
            <button id="step" type="button">Pas à pas</button>
            <button id="clear" type="button">Vider</button>
          </div>
        </details>

        <details class="group" open>
          <summary>Physique du monde</summary>
          <label class="row">
            <span>Vent</span>
            <input id="wind" type="range" min="-10" max="10" value="0" />
            <output id="wind-value">0</output>
          </label>
          <div class="row">
            <span>Gravité</span>
            <button id="gravity" type="button">Vers le bas ↓</button>
          </div>
        </details>

        <details class="group" open>
          <summary>Mondes</summary>
          <div class="buttons">
            <button id="save" type="button">Sauvegarder</button>
            <button id="share" type="button">Copier le lien</button>
            <button id="refresh" type="button">Rafraîchir</button>
          </div>
          <ul id="worlds" class="worlds"></ul>
          <p id="status" class="hint"></p>
        </details>
      </aside>
    </main>
  </body>
</html>
