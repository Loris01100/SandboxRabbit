# SonarCloud. L'analyse est lancée par la CI (.github/workflows/ci.yml, job
# `sonar`) et non par l'analyse automatique de SonarCloud : celle-ci ne lit
# aucun rapport de couverture, elle n'exécute pas les tests. La désactiver dans
# le projet (Administration > Analysis Method), sinon les deux analyses se
# recouvrent et la couverture repart à zéro à chaque passe automatique.
sonar.organization=loris01100
sonar.projectKey=Loris01100_SandboxRabbit

# `sonar.tests` est indispensable : sans lui, test/ compte comme du code à
# couvrir, et comme la couverture de Node exclut les fichiers de test, les sept
# scripts d'assert apparaîtraient à 0 %. Déclarer test/ oblige à déclarer
# `sonar.sources` : sans lui, la racine entière est source, et un fichier ne
# peut pas être indexé deux fois.
sonar.sources=src,index.html
sonar.tests=test

# dist/ est un build, rust/target/ aussi, et worker-configuration.d.ts est
# régénéré par `npm run cf-typegen` : personne ne les relit.
sonar.exclusions=dist/**,rust/target/**,worker-configuration.d.ts

# Produit par `npm run coverage` : LCOV aux chemins relatifs à la racine du
# dépôt, ce que Sonar attend. Un chemin absolu (ou un rapport produit ailleurs
# que depuis la racine) donne une couverture à 0 % sans erreur.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
