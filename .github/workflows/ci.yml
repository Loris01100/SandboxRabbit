# Typecheck, build et auto-vérifications à chaque poussée.
name: CI

on:
  push:
  pull_request:

# Rien à écrire ici : le workflow ne fait que lire le dépôt. Sans cette ligne,
# le GITHUB_TOKEN porte les droits d'écriture par défaut de l'organisation, et
# une action compromise en hériterait.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA : une étiquette (`@v4`) se redéplace, pas un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Seules les dépendances livrées au navigateur comptent : une alerte sur
      # vite ou wrangler n'atteint personne, et le bruit ferait ignorer la marche.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check
      # Le shader WebGL2 contre Renderer, et la page qui charge sans erreur :
      # rien d'autre ne les voit. Chromium seul, avec ses bibliothèques système.
      - run: npx playwright install --with-deps chromium
      - run: npm run browser
      # Le tick a été porté de 1,6 à 0,7 ms : ce budget est ce qui empêche de le
      # reperdre sans s'en apercevoir. Il est large exprès (le runner partagé
      # varie du simple au triple) : il attrape un effondrement, pas une dérive.
      - run: npm run bench
      # Un client sans framework grossit lentement et sans bruit. Deux budgets de
      # 80 ko non compressés : la page (JS + CSS, ce qui s'affiche d'abord) et
      # le moteur (le Worker de simulation, qui sert aussi de fil auxiliaire).
      # Un seul total ne disait pas lequel des deux avait grossi.
      - name: Budget de bundle
        run: |
          page=$(cat dist/client/assets/index-*.js dist/client/assets/*.css | wc -c)
          engine=$(cat dist/client/assets/worker-*.js | wc -c)
          echo "page : $page octets (budget 81920)"
          echo "moteur : $engine octets (budget 81920)"
          test "$page" -le 81920
          test "$engine" -le 81920
