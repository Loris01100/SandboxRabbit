# Typecheck, build et auto-vérifications à chaque poussée.
name: CI

on:
  push:
  pull_request:

# Rien à écrire ici : le workflow ne fait que lire le dépôt. Sans cette ligne,
# le GITHUB_TOKEN porte les droits d'écriture par défaut de l'organisation, et
# une action compromise en hériterait.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA : une étiquette (`@v4`) se redéplace, pas un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Seules les dépendances livrées au navigateur comptent : une alerte sur
      # vite ou wrangler n'atteint personne, et le bruit ferait ignorer la marche.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check
      # Le shader WebGL2 contre Renderer, et la page qui charge sans erreur :
      # rien d'autre ne les voit. Chromium seul, avec ses bibliothèques système.
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run browser
      # Le tick a été porté de 1,6 à 0,7 ms : ce budget est ce qui empêche de le
      # reperdre sans s'en apercevoir. Il est large exprès (le runner partagé
      # varie du simple au triple) : il attrape un effondrement, pas une dérive.
      - run: npm run bench
      # Les pires cas : un bac plein de chaque matière, explosion en chaîne,
      # onde de pression, lave, aimants, bandes 1920×1080. Un bac plein
      # d'aimants coûtait 2 s par tick sans que rien ne le montre.
      - run: npm run stress
      # La dérive, que les seuils absolus ne voient pas : bench et stress de la
      # branche visée, sur ce même runner et dans la foulée, contre ceux de la
      # pull request. Plus de 30 % plus lent sur une mesure : échec.
      - name: Dérive contre la branche visée
        if: github.event_name == 'pull_request'
        # Par l'environnement, pas insérée dans le script : un nom de branche
        # ne doit jamais devenir du shell.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          DRIFT_BASE=FETCH_HEAD npm run drift
      # Un client sans framework grossit lentement et sans bruit. Deux budgets
      # non compressés : la page (JS + CSS, ce qui s'affiche d'abord) et le
      # moteur (le Worker de simulation, qui sert aussi de fil auxiliaire), 80 Kio
      # chacun. Un seul total ne disait pas lequel des deux avait grossi.
      # La page est passée à 84 Kio avec le son : elle frôlait déjà les 80
      # (81 014 octets), et même chargé au premier geste (sound-*.js, hors
      # budget), le son y laisse sa porte (audio.ts) et l'assistant de Vite qui
      # enrobe tout `import()`, ~1,5 Ko qu'aucune option ne retire.
      - name: Budget de bundle
        run: |
          page=$(cat dist/client/assets/index-*.js dist/client/assets/*.css | wc -c)
          engine=$(cat dist/client/assets/worker-*.js | wc -c)
          echo "page : $page octets (budget 86016)"
          echo "moteur : $engine octets (budget 81920)"
          test "$page" -le 86016
          test "$engine" -le 81920

  # SonarCloud, dans son propre job : la couverture coûte 5 min là où `npm run
  # check` en prend 1 min 40 (l'instrumentation V8 triple le temps du moteur),
  # et un job parallèle ne rallonge pas la CI. L'analyse automatique de
  # SonarCloud ne saurait pas produire ce rapport : elle ne lance pas les tests.
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar attribue les problèmes et la couverture au « code neuf » à
          # partir de l'historique : avec le clone superficiel par défaut, tout
          # le dépôt passe pour neuf à chaque analyse.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Les mêmes sept scripts que `npm run check`, lancés par le runner de
      # tests de Node pour son rapport LCOV. Un assert qui tombe fait échouer
      # l'étape ici aussi : le job ne publie pas une couverture de tests rouges.
      - run: npm run coverage
      # Le secret manque sur une pull request venue d'un fork : l'analyse est
      # alors sautée plutôt que de faire échouer la CI d'une contribution.
      # `secrets` ne se lit pas dans un `if` : il faut le traverser par une
      # sortie d'étape, et seul `${VAR:+...}` sort un oui/non sans jamais
      # écrire le jeton dans le journal.
      - name: Jeton SonarCloud présent ?
        id: jeton
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "present=${SONAR_TOKEN:+oui}" >> "$GITHUB_OUTPUT"
      - name: Analyse SonarCloud
        if: steps.jeton.outputs.present == 'oui'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
